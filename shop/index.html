  cart=[];save();
  $("dTitle").textContent="Order placed";
  $("body").innerHTML='<div class="done"><div class="hint">Order '+esc(o.order_no)+'</div><h3>Thank you.</h3>'+(o.payment=="upi"?payBox(o.order_no,o.total):'<p class="hint">Please keep '+rs(o.total)+' ready in cash.</p>')+'<p class="hint" style="margin-top:10px">'+(S.whatsapp?' Tap below to confirm your order with us on WhatsApp.':' We will call you to confirm.')+'</p>'+(S.whatsapp?'<a class="btn solid auto" style="margin-top:18px" target="_blank" rel="noopener" href="https://wa.me/'+esc(S.whatsapp)+'?text='+encodeURIComponent(msg)+'">Confirm on WhatsApp</a>':'')+'<a class="btn auto" style="margin-top:12px" href="#account" data-close>Track your order</a></div>';
 });
}
function addToCart(id,once){var p=byId(id),s=picked[id]||p.sizes[0]||"",f=cart.filter(function(c){return c.id==id&&c.s==s})[0];if(f){if(!once)f.q=Math.min(10,f.q+1)}else cart.push({id:id,s:s,q:1});save()}
function openBag(){closeMenu();$("drawer").classList.add("on");$("scrim").classList.add("on");cartView()}
function closeMenu(){$("menu").classList.remove("on")}
function shut(){$("drawer").classList.remove("on");$("menu").classList.remove("on");$("modal").classList.remove("on");$("scrim").classList.remove("on");$("mbody").innerHTML=""}
function toCheckout(){if(!user){wantCo=true;return openAuth()}checkoutView()}

/* ---------- sign in / account ---------- */
function setUser(u){user=u||null;$("dot").hidden=!user;if(ready&&location.hash=="#account")route()}
function openAuth(){$("modal").classList.add("on");$("scrim").classList.add("on");authView()}
function authView(note){
 var h='<button class="ib x" data-close aria-label="Close">'+ICON.x+'</button>';
 if(mode=="reset"){
  $("mbody").innerHTML=h+'<h3>Set a new password</h3><label>New password</label><input id="a_p" type="password" autocomplete="new-password"><div class="msg" id="am"></div><button class="btn solid" id="aGo">Save password</button>';return}
 if(user){
  $("mbody").innerHTML=h+'<h3>Your account</h3><p class="hint">Signed in as '+esc(user.email)+'</p><div class="msg" id="am"></div><button class="btn" id="aOut">Sign out</button>';return}
 $("mbody").innerHTML=h+'<h3>'+(mode=="up"?"Create your account":"Sign in")+'</h3>'+(wantCo?'<p class="hint">Sign in to place your order. Your cart is saved.</p>':'')+
 '<div class="tabs"><button data-m="in" class="'+(mode=="in"?"on":"")+'">Sign in</button><button data-m="up" class="'+(mode=="up"?"on":"")+'">Create account</button></div>'+
 (mode=="up"?'<label>Full name</label><input id="a_n" autocomplete="name">':'')+'<label>Email</label><input id="a_e" type="email" autocomplete="username"><label>Password</label><input id="a_p" type="password" autocomplete="'+(mode=="up"?"new-password":"current-password")+'">'+
 '<div class="msg'+(note&&note.ok?" ok":"")+'" id="am">'+esc(note?note.t:"")+'</div><button class="btn solid" id="aGo">'+(mode=="up"?"Create account":"Sign in")+'</button>'+(mode=="in"?'<p style="text-align:center;margin:14px 0 0"><button class="lnk" id="aForgot">Forgot password?</button></p>':'');
}
function afterLogin(){shut();if(wantCo){wantCo=false;openBag();checkoutView()}}
function authGo(){
 var v=function(i){return $(i)?$(i).value.trim():""},m=function(t,ok){$("am").textContent=t;$("am").className="msg"+(ok?" ok":"")};
 var pw=$("a_p").value;
 if(mode=="reset"){if(pw.length<8)return m("Password must be at least 8 characters.");return db.auth.updateUser({password:pw}).then(function(r){if(r.error)return m(r.error.message);mode="in";setUser(r.data.user);shut()})}
 var em=v("a_e");if(!/^\S+@\S+\.\S+$/.test(em))return m("Enter a valid email address.");
 if(pw.length<8)return m("Password must be at least 8 characters.");
 $("aGo").disabled=true;
 if(mode=="up"){
  var nm=v("a_n");if(nm.length<2){$("aGo").disabled=false;return m("Please enter your name.")}
  db.auth.signUp({email:em,password:pw,options:{data:{name:nm},emailRedirectTo:location.href.split("#")[0]}}).then(function(r){
   $("aGo").disabled=false;if(r.error)return m(r.error.message);
   if(r.data.session){setUser(r.data.user);afterLogin()}else m("Account created. Check your email to confirm it, then sign in.",true)});
 }else{
  db.auth.signInWithPassword({email:em,password:pw}).then(function(r){
   $("aGo").disabled=false;if(r.error)return m(r.error.message);setUser(r.data.user);afterLogin()});
 }
}

/* ---------- events ---------- */
document.addEventListener("click",function(e){
 var t=e.target,c=function(s){return t.closest(s)},el;
 if(c("[data-close]")||t.id=="scrim"){shut();return}
 if(el=c("[data-f]")){var z=el.dataset.f,i=fsz.indexOf(z);i>-1?fsz.splice(i,1):fsz.push(z);keep(shop);return}
 if(c("[data-clear]")){fsz=[];keep(shop);return}
 if(el=c("[data-g]")){var id=location.hash.slice(9);gal[id]=+el.dataset.g;keep(function(){product(byId(id))});return}
 if(el=c("[data-p]")){picked[el.dataset.p]=el.dataset.s;lastSize=el.dataset.s;keep(function(){product(byId(el.dataset.p))});return}
 if(el=c("[data-add]")){addToCart(el.dataset.add);openBag();return}
 if(el=c("[data-buy]")){addToCart(el.dataset.buy,true);openBag();toCheckout();return}
 if(el=c("[data-q]")){var ln=cart[el.dataset.q];ln.q=Math.min(10,ln.q+ +el.dataset.d);if(ln.q<1)cart.splice(el.dataset.q,1);save();cartView();return}
 if(el=c("[data-pay]")){var vv=formVals();payM=el.dataset.pay;checkoutView(vv);return}
 if(el=c("[data-utr]")){var no=el.dataset.utr,u=$("utr_"+no).value.trim(),um=$("um_"+no);if(!/^[A-Za-z0-9]{6,30}$/.test(u)){um.textContent="Enter the reference number from your UPI app.";return}
  db.rpc("submit_payment_ref",{p_order_no:no,p_utr:u}).then(function(r){um.className="msg"+(r.error?"":" ok");um.textContent=r.error?r.error.message:"Thanks! We will verify your payment shortly.";if(!r.error)el.disabled=true});return}
 if(el=c("[data-sadd]")){var vals=null;if($("f_n")){vals={};["f_n","f_p","f_a","f_c","f_s","f_z"].forEach(function(i){vals[i]=$(i).value})}addToCart(el.dataset.sadd);vals?checkoutView(vals):cartView();return}
 if(el=c("[data-rm]")){cart.splice(el.dataset.rm,1);save();cartView();return}
 if(el=c("[data-m]")){mode=el.dataset.m;authView();return}
 if(c("#signinBtn")){wantCo=false;openAuth();return}
 if(c("#toCo")){toCheckout();return}
 if(c("#back")){cartView();return}
 if(c("#place")){place();return}
 if(c("#aGo")){authGo();return}
 if(c("#aOut")){db.auth.signOut().then(function(){setUser(null);shut();if(location.hash=="#account")location.hash=""});return}
 if(c("#aForgot")){var em=$("a_e").value.trim();if(!em){$("am").textContent="Enter your email above first.";return}
  db.auth.resetPasswordForEmail(em,{redirectTo:location.href.split("#")[0]}).then(function(r){$("am").className="msg"+(r.error?"":" ok");$("am").textContent=r.error?r.error.message:"Password reset link sent. Check your email."});return}
 if(c("#acct")){wantCo=false;if(user){shut();location.hash="account"}else openAuth();return}
});
document.addEventListener("change",function(e){if(e.target.id=="srt"){srt=e.target.value;keep(shop)}});
document.addEventListener("keydown",function(e){if(e.key=="Escape")shut();if(e.key=="Enter"&&e.target.tagName=="INPUT"&&e.target.closest("#mbody")&&$("aGo"))authGo()});
$("cartBtn").onclick=openBag;
$("burger").onclick=function(){$("menu").classList.add("on");$("scrim").classList.add("on")};
$("mnu").onclick=function(e){if(e.target.closest("a"))shut()};

/* ---------- start ---------- */
save();
db.auth.onAuthStateChange(function(ev,s){setTimeout(function(){setUser(s&&s.user);if(ev=="PASSWORD_RECOVERY"){mode="reset";openAuth()}},0)});
db.auth.getSession().then(function(r){setUser(r.data.session&&r.data.session.user)});
Promise.all([db.from("products").select("id,name,category,price,sizes,description,details,images,video_url,active,created_at,compare_price,size_prices,badge,group_id,color,color_hex").eq("active",true).order("created_at",{ascending:false}),db.from("settings").select("*").eq("id",1).maybeSingle()]).then(function(r){
 if(r[0].error)throw r[0].error;P=r[0].data||[];if(r[1].data)S=r[1].data;
 cart=cart.filter(function(c){var p=byId(c.id);if(!p)return false;if(p.sizes.length&&p.sizes.indexOf(c.s)<0)c.s=p.sizes[0];if(!p.sizes.length)c.s="";c.q=Math.max(1,Math.min(10,c.q|0));return true});save();ready=true;route();
}).catch(function(e){$("view").innerHTML='<div class="empty">Could not load the store. '+esc(e.message||"")+'</div>'});
</script></body></html>
